services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "DevOnly-Password123!"
    ports:
      - "1433:1433"
  api:
    build:
      context: .
      dockerfile: taskboard-api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=TaskBoard;User Id=sa;Password=DevOnly-Password123!;TrustServerCertificate=True"
      Jwt__Key: "DevOnly-Change-Me-TaskBoard-0123456789ABCDEF"
    ports:
      - "5000:5000"
    depends_on:
      - db
  web:
    build:
      context: .
      dockerfile: taskboard-web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
